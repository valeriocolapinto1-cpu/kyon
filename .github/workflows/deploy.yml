name: Deploy

# Runs only after CI succeeded on a push to main, so broken code never reaches Cloudflare.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: lets the first account sign up at /join/<code> (see docs/SETUP.md).
      ADMIN_BOOTSTRAP_CODE: ${{ secrets.ADMIN_BOOTSTRAP_CODE }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets missing: deploy skipped. See docs/SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'
      - run: pnpm build
        if: steps.secrets.outputs.ready == 'true'
      - run: pnpm run deploy
        if: steps.secrets.outputs.ready == 'true'
